services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_PASSWORD: job_tracker
      POSTGRES_USER: job_tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_tracker -d job_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: job_tracker_test
      POSTGRES_PASSWORD: job_tracker
      POSTGRES_USER: job_tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_tracker -d job_tracker_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://job_tracker:job_tracker@postgres:5432/job_tracker
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
